name: Documentation

on:
  # Documentation doesn't need to be rebuilt if the contents have not been
  # modified, if dependencies have not been updated, ot if configuration
  # remains untouched.
  #
  # Additionally, it only really applies to the main branch.
  push:
    branches:
      - main
    paths:
      - docs/**
      - uv.lock
      - zensical.toml

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean 
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
